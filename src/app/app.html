<main>
  <h1>{{ title }}</h1>

  <div class="nueva-tarea">
    <input
      type="text"
      #inputTarea
      placeholder="Nueva Tarea"
      (keyup.enter)="store.agregar(inputTarea.value); inputTarea.value = ''"
    />

    <button (click)="store.agregar(inputTarea.value); inputTarea.value = ''">Agregar</button>
    <button (click)="store.eliminarCompletadas(); inputTarea.value = ''" [disabled]="store.pendientes() === store.tareas().length" [class.deshabilitado]="store.pendientes() === store.tareas().length">
      Eliminar Completadas</button>

  </div>

  <ul>
    @for (tarea of store.tareas(); track tarea.id) {
      <li (click)="store.toggle(tarea.id)" [class.hecha]="tarea.completada">
        <span>{{ tarea.titulo }}</span>

        <span class="acciones">
          @if (tarea.completada) {
            <span>Ok</span>
          }

          <button type="button" class="eliminar" (click)="store.eliminar(tarea.id);$event.stopPropagation()">
            Eliminar
          </button>
        </span>
      </li>
    } @empty {
      <li>No hay tareas. Agrega una!!</li>
    }
  </ul>
</main>

<router-outlet />
