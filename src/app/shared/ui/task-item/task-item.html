<li (click)="toggle.emit(task().id)" [class.hecha]="task().completada">
        <span>{{ task().titulo }}</span>

        <span class="acciones">
          @if (task().completada) {
            <span>Ok</span>
          }
          <a class="ver" [routerLink]="['/tarea', task().id]" (click)="$event.stopPropagation()">🔍</a>
           
          <button type="button" class="eliminar" (click)="removed.emit(task().id);$event.stopPropagation()">
            Eliminar
          </button>
        </span>
      </li>
